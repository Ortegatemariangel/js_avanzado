
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pelota animada</title>
</head>
<body>
    <h1>Pelota que rebota</h1>

    <canvas id="lienzo" width="600" height="300"
            style="border: 2px solid purple;">
    </canvas>

    <script>
        const canvas = document.getElementById("lienzo");
        const ctx = canvas.getContext("2d");

        let x = 50;
        let y = 50;
        let velocidadX = 3;
        let velocidadY = 2;

        function animar() {
            ctx.clearRect(0, 0, 600, 300);

            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fillStyle = "purple";
            ctx.fill();

            x += velocidadX;
            y += velocidadY;

            if (x > 580 || x < 20) {
                velocidadX *= -1;
            }

            if (y > 280 || y < 20) {
                velocidadY *= -1;
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
